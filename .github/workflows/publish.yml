name: publish

# On a published GitHub Release whose tag starts with csharp-v (e.g. csharp-v1.2.0):
#  - publishes NMX.SudokuGen.Library to NuGet.org (Trusted Publishing / OIDC, no stored key)
#  - attaches the library DLL, its XML docs and the license to the release as a zip
#  - signs the Unity package com.newmediaxp.sudokugen and attaches it as a .tgz, which OpenUPM publishes
#    from the release
#  - builds Native AOT executables of the CLI for each platform and attaches them to the release
#  - publishes the CLI to NuGet.org as the .NET tool NMX.SudokuGen.Cli (command sudokugen):
#    one Native AOT package per platform, a framework-dependent fallback and the pointer package
#  Bump <Version> in the csprojs and commit before creating the release.
# On a published GitHub Release whose tag starts with javascript-v (e.g. javascript-v1.2.0):
#  - publishes nmx.sudokugen.library to npm (Trusted Publishing / OIDC, with provenance)
#  Bump "version" in javascript/nmx.sudokugen.library/package.json and commit before creating the release.
# The languages share this repo, so every job checks the tag prefix. A manual run (workflow_dispatch)
# runs every job; the registries skip versions they already have, and the signed Unity .tgz is kept as a
# workflow artifact instead of attached to a release.
# NuGet's and npm's trusted publishing settings name this file: update them before renaming it.
# The release steps are in RELEASING.md.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-nuget:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'csharp-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required: lets the job request the OIDC token for trusted publishing
      contents: write   # required to upload the library zip to the release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore csharp/NMX.SudokuGen.Library.sln

      - name: Test
        run: dotnet test csharp/NMX.SudokuGen.Library.sln -c Release --no-restore

      - name: Pack
        run: dotnet pack csharp/NMX.SudokuGen.Library -c Release -o ./artifacts

      - name: NuGet trusted-publishing login
        id: login
        uses: NuGet/login@v1
        with:
          user: NewMediaXP

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # for setups without NuGet (e.g. Unity's Assets/Plugins); runs after the push, so a failed upload
      # never holds back NuGet, and zips outside ./artifacts, which holds only what NuGet gets
      - name: Attach the library to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lib=csharp/NMX.SudokuGen.Library/bin/Release/netstandard2.1
          mkdir -p dist
          zip -j dist/SudokuGenLib-netstandard2.1.zip "$lib/SudokuGenLib.dll" "$lib/SudokuGenLib.xml" LICENSE
          gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

      # OpenUPM watches the csharp-v tags and publishes this .tgz from the release unchanged
      # (trackingMode: githubRelease); it needs the package.json version to match the tag.
      # upm pack signs it for Unity 6.3+ with a Unity service account (role Package Manager Package Signer),
      # from the newmediaxp GitHub org secrets UPM_*; nothing may change the .tgz's contents after it
      - name: Install the Unity UPM CLI
        run: |
          curl -fsSL https://cdn.packages.unity.com/upm-cli/install.sh | bash
          echo "$HOME/.upm/bin" >> "$GITHUB_PATH"

      - name: Sign the Unity package
        env:
          TAG: ${{ github.event.release.tag_name }}
          UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
          UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
          UPM_ORG_ID: ${{ secrets.UPM_ORG_ID }}
        run: |
          lib=csharp/NMX.SudokuGen.Library/bin/Release/netstandard2.1
          pkg=unity/com.newmediaxp.sudokugen
          version=$(dotnet msbuild csharp/NMX.SudokuGen.Library -getProperty:Version)
          if [ -n "$TAG" ] && [ "$TAG" != "csharp-v$version" ]; then echo "::error::tag $TAG doesn't match the library version $version"; exit 1; fi
          cp "$lib/SudokuGenLib.dll" "$lib/SudokuGenLib.xml" "$pkg/Runtime/"
          cp LICENSE "$pkg/LICENSE.md"
          (cd "$pkg" && npm pkg set version="$version")
          upm pack "$pkg" --organization-id "$UPM_ORG_ID" --destination "$RUNNER_TEMP/upm"
          # renaming the file keeps the signature, which is inside it; the name is what OpenUPM's
          # githubReleaseAssetName prefix matches
          tgz="unity-dist/com.newmediaxp.sudokugen-$version.tgz"
          mkdir -p unity-dist
          mv "$RUNNER_TEMP"/upm/*.tgz "$tgz"
          tar -tzf "$tgz" | grep -qx 'package/.attestation.p7m' || { echo "::error::$tgz isn't signed"; exit 1; }
          tar -tzf "$tgz" | grep -qx 'package/Runtime/SudokuGenLib.dll' || { echo "::error::$tgz has no SudokuGenLib.dll"; exit 1; }
          echo "UNITY_TGZ=$tgz" >> "$GITHUB_ENV"

      - name: Attach the Unity package to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$UNITY_TGZ" --clobber

      # a manual run tests the signing without a release
      - name: Upload the Unity package as a workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: com.newmediaxp.sudokugen
          path: unity-dist/*.tgz
          if-no-files-found: error

  publish-npm:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'javascript-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required: lets npm request the OIDC token for trusted publishing and provenance
      contents: read
    defaults:
      run:
        working-directory: javascript
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: javascript/.node-version
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Publish to npm
        # skips a version npm already has, like NuGet's --skip-duplicate; npm publish runs prepack, which builds
        run: |
          name=$(node -p "require('./nmx.sudokugen.library/package.json').name")
          version=$(node -p "require('./nmx.sudokugen.library/package.json').version")
          if npm view "$name@$version" version > /dev/null 2>&1; then echo "$name@$version is already on npm"; exit 0; fi
          npm publish --workspace nmx.sudokugen.library

  cli-aot:
    name: cli ${{ matrix.rid }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'csharp-v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # required to upload assets to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   rid: win-x64,    ext: ".exe" }
          - { os: windows-latest,   rid: win-x86,    ext: ".exe" }
          - { os: windows-11-arm,   rid: win-arm64,  ext: ".exe" }
          - { os: ubuntu-latest,    rid: linux-x64,  ext: "" }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, ext: "" }
          - { os: macos-15-intel,   rid: osx-x64,    ext: "" }
          - { os: macos-latest,     rid: osx-arm64,  ext: "" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT
        run: dotnet publish csharp/NMX.SudokuGen.Cli -c Release -r ${{ matrix.rid }} -o publish

      # Native AOT only compiles on the target's OS, so each platform's tool package is packed here
      - name: Pack the tool package
        run: dotnet pack csharp/NMX.SudokuGen.Cli -c Release -r ${{ matrix.rid }} -o packages

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "publish/SudokuGen${{ matrix.ext }}" "dist/SudokuGen-${{ matrix.rid }}${{ matrix.ext }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: SudokuGen-${{ matrix.rid }}
          path: dist/*

      - name: Upload the tool package
        uses: actions/upload-artifact@v7
        with:
          name: tool-${{ matrix.rid }}
          path: packages/NMX.SudokuGen.Cli.${{ matrix.rid }}.*.nupkg
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

  publish-cli-tool:
    # runs only when every platform's package built, so NuGet never gets a partial set
    needs: cli-aot
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'csharp-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required: lets the job request the OIDC token for trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download the platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: tool-*
          path: packages
          merge-multiple: true

      # any: the framework-dependent fallback for platforms without a Native AOT package;
      # the plain pack makes the pointer package that lists every platform package
      - name: Pack the fallback and pointer packages
        run: |
          dotnet pack csharp/NMX.SudokuGen.Cli -c Release -r any -p:PublishAot=false -p:PublishTrimmed=false -o packages
          dotnet pack csharp/NMX.SudokuGen.Cli -c Release -o packages

      - name: NuGet trusted-publishing login
        id: login
        uses: NuGet/login@v1
        with:
          user: NewMediaXP

      # the platform packages (ids end in a RID) go first, the pointer (id then version) last,
      # so the pointer never goes live before the packages it lists
      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for f in packages/NMX.SudokuGen.Cli.[a-z]*.nupkg packages/NMX.SudokuGen.Cli.[0-9]*.nupkg; do
            dotnet nuget push "$f" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
